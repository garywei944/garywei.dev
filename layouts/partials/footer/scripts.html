{{ if .Params.math }}{{ partialCached "head/p/math.html" . }}{{ end }}

{{ $s := slice "js/main.js" }}
{{ if .Params.js }}
  {{ $s = $s | append .Params.js | uniq }}
{{ end }}

{{ range $s }}
  {{ $r := resources.Get . | minify | fingerprint }}
  {{ if hugo.IsServer }}
    <script src="{{ $r.RelPermalink }}"></script>
  {{ else }}
    <script src="{{ $r.RelPermalink }}" integrity="{{ $r.Data.Integrity }}" crossorigin="anonymous"></script>
  {{ end }}
{{ end }}
