experience:
  - id: 'experience-bytedance'
    svg: '/images/svg/bytedance-seeklogo.svg'
    name: 'ByteDance Ltd.'
    title: 'Machine Learning Engineer'
    time: 'Aug 2024 – Present'
    note: |
      At ByteDance, I work on distributed machine learning infrastructure,
      with a focus on performance and reliability at scale.
  - id: 'experience-relax-ml'
    img: '/images/avatar_cornell.png'
    name: 'Cornell Relax ML Lab'
    title: 'Research Assistant'
    time: 'Feb 2023 – May 2024'
    note: |
      At [**Cornell Relax ML Lab**](https://relax-ml.cs.cornell.edu/), I worked
      with Prof. [**Chris De Sa**](https://www.cs.cornell.edu/~cdesa/) on efficient
      algorithms and systems for large-scale machine learning. My research combined
      optimization with parallel and distributed computing.
  - img: '/images/avatar_umass_badge.png'
    name: 'UMass BioNLP Lab'
    title: 'Research Assistant'
    time: 'May 2021 – Jun 2022'
    note: |
      At [**UMass BioNLP Lab**](https://bio-nlp.github.io/), I worked with Prof.
      [**Hong Yu**](https://www.uml.edu/research/chords/faculty/yu-hong.aspx) on
      biomedical NLP research and applications for electronic health records.

      My work spanned information retrieval, model development, performance analysis,
      and full-stack application engineering.
