skills:
  - svg: '/images/svg/001-options.svg'
    title: 'Machine Learning Systems'
    note: |
      I build and contribute to machine learning systems with PyTorch, JAX,
      and related tools.

      My work emphasizes efficiency, reliability, and real-world performance at scale.
  - svg: '/images/svg/002-chat.svg'
    title: 'Full-Stack & Cloud'
    note: |
      I have built full-stack applications with Django, Express, SQL and NoSQL
      databases, and AWS serverless services since 2019.

      This site is generated with Hugo and deployed to AWS through GitHub Actions.
  - svg: '/images/svg/003-contact-book.svg'
    title: 'Systems & Automation'
    note: |
      I have been a **proud Arch Linux user** since 2020. I also work across Ubuntu,
      Windows, and macOS, using containers and virtual machines when they fit the job.

      I maintain [**eva_arch**](https://github.com/garywei944/eva_arch) as my
      cross-platform dotfiles repository and [**Eden**](https://github.com/garywei944/eden)
      for one-click initialization across Unix-like systems.
  - svg: '/images/svg/004-percentage.svg'
    title: 'Distributed Systems & HPC'
    note: |
      My systems background includes distributed algorithms, fault tolerance,
      CUDA, Triton, OpenMP, and MPI.

      I have built projects ranging from Paxos and Raft to multi-GPU scientific
      computing. See my [**academic profile**](https://acad.garywei.dev#publications)
      for publications and research projects.

  - svg: '/images/svg/006-goal.svg'
    title: 'Game Development'
    note: |
      I learned game development with Unity in UMass CS 576 and built several small games.

      I enjoy games both as a player and as a developer.
  - svg: '/images/svg/005-line-chart.svg'
    title: 'Cybersecurity'
    note: |
      I studied reverse engineering and vulnerability analysis at UMass Amherst
      and continue to practice binary analysis and exploitation through CTFs.
